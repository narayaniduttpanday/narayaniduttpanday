<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#3b0003"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 40px;
        fill: #FFFFFF;
        letter-spacing: 3px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: #E50914;
        letter-spacing: 6px;
      }
      .web-line-bg { stroke: #ffffff; stroke-opacity: 0.08; stroke-width: 1; }
      .web-radial { stroke: #E50914; stroke-opacity: 0.15; stroke-width: 1; fill: none; }

      /* Spider Animation Path: Crawls N -> Y, swings back Y -> N */
      @keyframes crawlAndSwing {
        0% {
          transform: translate(145px, 72px) rotate(90deg);
        }
        40% {
          transform: translate(740px, 72px) rotate(90deg);
        }
        45% {
          transform: translate(755px, 95px) rotate(180deg);
        }
        75% {
          transform: translate(160px, 115px) rotate(-35deg);
        }
        85% {
          transform: translate(145px, 85px) rotate(0deg);
        }
        100% {
          transform: translate(145px, 72px) rotate(90deg);
        }
      }

      /* Web Thread Animation during Swing */
      @keyframes webSwingThread {
        0%, 40% { opacity: 0; stroke-dashoffset: 600; }
        42% { opacity: 1; }
        70% { opacity: 0.8; stroke-dashoffset: 0; }
        75%, 100% { opacity: 0; stroke-dashoffset: 600; }
      }

      .spider-group {
        animation: crawlAndSwing 7s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
      }

      .swing-web {
        stroke: #ffffff;
        stroke-width: 1.5;
        stroke-dasharray: 600;
        animation: webSwingThread 7s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg-grad)" rx="10"/>

  <!-- Background SpiderWeb Network -->
  <g class="web-line-bg">
    <line x1="0" y1="0" x2="900" y2="220" />
    <line x1="900" y1="0" x2="0" y2="220" />
    <line x1="450" y1="0" x2="450" y2="220" />
    <line x1="0" y1="110" x2="900" y2="110" />
  </g>
  <path class="web-radial" d="M 250 110 Q 450 30 650 110 Q 450 190 250 110 Z" />
  <path class="web-radial" d="M 150 110 Q 450 -20 750 110 Q 450 240 150 110 Z" />

  <!-- Dynamic Swinging Web Line -->
  <line class="swing-web" x1="755" y1="95" x2="160" y2="115" />

  <!-- Name & Subtitle Header -->
  <g text-anchor="middle">
    <!-- Glow Effect -->
    <text x="450" y="110" class="title" filter="url(#glow)" opacity="0.3" fill="#E50914">NARAYANI DUTT PANDEY</text>
    <!-- Main Text -->
    <text x="450" y="110" class="title">NARAYANI DUTT PANDEY</text>
    <text x="450" y="150" class="subtitle">SPIDER-MAN | BRAND NEW DAY</text>
  </g>

  <!-- Animated Crawling/Swinging Spider -->
  <g class="spider-group">
    <!-- Spider Body -->
    <g transform="scale(0.5) translate(-20, -20)">
      <!-- Web Line attached to Spider tail -->
      <line x1="20" y1="0" x2="20" y2="-15" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
      <!-- Legs -->
      <path d="M 5 10 Q -10 0 -15 10 M 5 18 Q -12 18 -18 25 M 5 26 Q -10 32 -12 40" stroke="#E50914" stroke-width="2.5" fill="none"/>
      <path d="M 35 10 Q 50 0 55 10 M 35 18 Q 52 18 58 25 M 35 26 Q 50 32 52 40" stroke="#E50914" stroke-width="2.5" fill="none"/>
      <!-- Body Center -->
      <ellipse cx="20" cy="12" rx="5" ry="7" fill="#ffffff"/>
      <ellipse cx="20" cy="26" rx="8" ry="12" fill="#E50914"/>
    </g>
  </g>
</svg>
